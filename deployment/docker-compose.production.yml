version: '3.8'

services:
  # Redis Database
  redis:
    image: redis:7-alpine
    container_name: clipping-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - clipping-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Ollama AI Service
  ollama:
    image: ollama/ollama:latest
    container_name: clipping-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - clipping-network
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Queue Service
  queue-service:
    build:
      context: ../queue-service
      dockerfile: Dockerfile
    container_name: clipping-queue-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:3004"
    volumes:
      - queue-logs:/app/logs
      - ../queue-service:/app
      - /app/node_modules
    networks:
      - clipping-network
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PORT=3004
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Storage Service
  storage-service:
    build:
      context: ../storage-service
      dockerfile: Dockerfile
    container_name: clipping-storage-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:3005"
    volumes:
      - storage-logs:/app/logs
      - storage-uploads:/app/uploads
      - storage-temp:/app/temp
      - ../storage-service:/app
      - /app/node_modules
    networks:
      - clipping-network
    environment:
      - NODE_ENV=production
      - PORT=3005
      - LOG_LEVEL=info
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - GCS_PROJECT_ID=${GCS_PROJECT_ID}
      - GCS_KEY_FILE=${GCS_KEY_FILE}
      - GCS_BUCKET=${GCS_BUCKET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # API Gateway
  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: clipping-api-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - gateway-logs:/app/logs
      - ../api-gateway:/app
      - /app/node_modules
    networks:
      - clipping-network
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=1000
      - QUEUE_SERVICE_URL=http://queue-service:3004
      - STORAGE_SERVICE_URL=http://storage-service:3005
    depends_on:
      redis:
        condition: service_healthy
      queue-service:
        condition: service_healthy
      storage-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # AI Worker
  ai-worker:
    build:
      context: ../workers/ai
      dockerfile: Dockerfile
    container_name: clipping-ai-worker
    restart: unless-stopped
    volumes:
      - ai-logs:/app/logs
      - ../workers/ai:/app
      - /app/node_modules
    networks:
      - clipping-network
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - AI_WORKER_CONCURRENCY=2
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    deploy:
      replicas: 2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Transcription Worker
  transcription-worker:
    build:
      context: ../workers/transcription
      dockerfile: Dockerfile
    container_name: clipping-transcription-worker
    restart: unless-stopped
    volumes:
      - transcription-logs:/app/logs
      - transcription-models:/app/models
      - ../workers/transcription:/app
      - /app/node_modules
    networks:
      - clipping-network
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - WHISPER_MODEL=medium
      - TRANSCRIPTION_WORKER_CONCURRENCY=1
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Video Worker
  video-worker:
    build:
      context: ../workers/video
      dockerfile: Dockerfile
    container_name: clipping-video-worker
    restart: unless-stopped
    volumes:
      - video-logs:/app/logs
      - video-temp:/app/temp
      - ../workers/video:/app
      - /app/node_modules
    networks:
      - clipping-network
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - VIDEO_WORKER_CONCURRENCY=2
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Whisper Timestamp Worker
  whisper-timestamp-worker:
    build:
      context: ../workers/whisper-timestamp
      dockerfile: Dockerfile
    container_name: clipping-whisper-timestamp-worker
    restart: unless-stopped
    volumes:
      - whisper-timestamp-logs:/app/logs
      - whisper-timestamp-models:/app/models
      - ../workers/whisper-timestamp:/app
      - /app/node_modules
    networks:
      - clipping-network
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PYTHON_EXECUTABLE=python3
      - WHISPER_TIMESTAMP_WORKER_CONCURRENCY=1
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend (Next.js)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    container_name: clipping-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - frontend-logs:/app/.next
    networks:
      - clipping-network
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Commander (Admin Interface) - Only in development
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: clipping-redis-commander
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - clipping-network
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD}
      - HTTP_USER=${REDIS_COMMANDER_USER}
      - HTTP_PASSWORD=${REDIS_COMMANDER_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - admin
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: clipping-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    networks:
      - clipping-network
    depends_on:
      - frontend
      - api-gateway
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
    driver: local
  ollama-data:
    driver: local
  queue-logs:
    driver: local
  storage-logs:
    driver: local
  storage-uploads:
    driver: local
  storage-temp:
    driver: local
  gateway-logs:
    driver: local
  ai-logs:
    driver: local
  transcription-logs:
    driver: local
  transcription-models:
    driver: local
  video-logs:
    driver: local
  video-temp:
    driver: local
  whisper-timestamp-logs:
    driver: local
  whisper-timestamp-models:
    driver: local
  frontend-logs:
    driver: local
  nginx-logs:
    driver: local

networks:
  clipping-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 