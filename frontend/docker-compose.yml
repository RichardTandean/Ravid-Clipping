version: '3.8'

services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_STORAGE_URL=http://localhost:4002
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - QUEUE_SERVICE_URL=http://queue-service:4001
      - STORAGE_SERVICE_URL=http://storage-service:4002
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - redis
      - queue-service
      - storage-service

  queue-service:
    build: 
      context: ./queue-service
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./queue-service:/app
      - /app/node_modules
    depends_on:
      - redis

  video-worker:
    build: 
      context: ./workers/video
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - STORAGE_SERVICE_URL=http://storage-service:4002
    volumes:
      - ./workers/video:/app
      - /app/node_modules
    depends_on:
      - redis
      - queue-service
      - storage-service

  transcription-worker:
    build: 
      context: ./workers/transcription
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - STORAGE_SERVICE_URL=http://storage-service:4002
    volumes:
      - ./workers/transcription:/app
      - /app/node_modules
    depends_on:
      - redis
      - queue-service
      - storage-service

  ai-worker:
    build: 
      context: ./workers/ai
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - STORAGE_SERVICE_URL=http://storage-service:4002
    volumes:
      - ./workers/ai:/app
      - /app/node_modules
    depends_on:
      - redis
      - queue-service
      - storage-service

  storage-service:
    build: 
      context: ./storage-service
      dockerfile: Dockerfile
    ports:
      - "4002:4002"
    environment:
      - NODE_ENV=development
      - STORAGE_PATH=/data
    volumes:
      - ./storage-service:/app
      - /app/node_modules
      - storage_data:/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  storage_data:
  redis_data: 